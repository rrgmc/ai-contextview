name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Tag is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is not on master"
            exit 1
          fi

      # Fails unless CHANGELOG.md has the release section and links and
      # changelog.d/ holds no unmerged change files.
      - name: Changelog is merged
        run: go run ./tools/changelog check "$GITHUB_REF_NAME"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Windows gets ai-specview.exe in a .zip, the others a .tar.gz.
      - name: Build binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            name="ai-specview_${GITHUB_REF_NAME}_${os}_${arch}"
            exe=""
            [ "$os" = windows ] && exe=".exe"
            mkdir "$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "$name/ai-specview$exe" ./cmd/ai-specview
            cp LICENSE README.md CHANGELOG.md "$name/"
            if [ "$os" = windows ]; then
              zip -qr "dist/$name.zip" "$name"
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- *.tar.gz *.zip > checksums.txt)

      - name: Release notes
        run: |
          {
            go run ./tools/changelog notes "$GITHUB_REF_NAME"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "go install github.com/rrgmc/ai-specview/cmd/ai-specview@$GITHUB_REF_NAME"
            echo '```'
            echo
            echo "Or download the archive for your system below."
          } > notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
