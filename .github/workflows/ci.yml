name: CI

on:
  push:
    branches: [master]
    # A push that only changes docs or the changelog (a release commit, for
    # one) skips CI; the Release workflow runs the tests itself. No test reads
    # a markdown file of the repository.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is left out: its hosted runners are too slow. Test on a Mac
        # locally before a release.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The hosted runners ship Chrome, so the browser tests in
      # internal/daemon/browser_test.go run here too.
      - name: go test
        run: go test -race ./...
